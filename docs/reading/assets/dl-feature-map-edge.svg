<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Two filters read the same row</title>
  <desc id="desc">Input cells 10, 10, 40, 40. A two-cell difference filter gives 0, 30, 0. A sum filter gives 20, 50, 80. Each output corresponds to a window of two input cells.</desc>
  <rect width="720" height="300" rx="16" fill="#edf3fa"/>
  <g font-family="system-ui,sans-serif" font-size="20" fill="#193c5a">
    <text x="28" y="56">Input row</text>
    <text x="28" y="153">Difference</text><text x="28" y="177" font-size="16">right − left</text>
    <text x="28" y="245">Sum</text><text x="28" y="269" font-size="16">left + right</text>
  </g>
  <g stroke="#64819b" stroke-width="2">
    <path d="M265 82v13l52 25m52-38v13l-52 25m52-25 52 25m52-38v13l-52 25m52-25 52 25m52-38v13l-52 25" fill="none"/>
    <path d="M317 174v45m104-45v45m104-45v45" stroke-dasharray="5 6"/>
  </g>
  <g stroke="#71869a">
    <rect x="215" y="24" width="100" height="58" rx="8" fill="#c5d3e0"/>
    <rect x="319" y="24" width="100" height="58" rx="8" fill="#c5d3e0"/>
    <rect x="423" y="24" width="100" height="58" rx="8" fill="#fff"/>
    <rect x="527" y="24" width="100" height="58" rx="8" fill="#fff"/>
    <rect x="269" y="120" width="96" height="54" rx="8" fill="#fff"/>
    <rect x="373" y="120" width="96" height="54" rx="8" fill="#ace7d5"/>
    <rect x="477" y="120" width="96" height="54" rx="8" fill="#fff"/>
    <rect x="269" y="219" width="96" height="54" rx="8" fill="#fff"/>
    <rect x="373" y="219" width="96" height="54" rx="8" fill="#e2efff"/>
    <rect x="477" y="219" width="96" height="54" rx="8" fill="#c3ddfc"/>
  </g>
  <g text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#193c5a">
    <text x="265" y="61">10</text><text x="369" y="61">10</text><text x="473" y="61">40</text><text x="577" y="61">40</text>
    <text x="317" y="155">0</text><text x="421" y="155">30</text><text x="525" y="155">0</text>
    <text x="317" y="254">20</text><text x="421" y="254">50</text><text x="525" y="254">80</text>
  </g>
</svg>
