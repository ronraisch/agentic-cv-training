<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img"><title>One pixel of disparity can matter a lot.</title><desc>d=10 → Z=10 m; d=9 → Z≈11.1 m; Z=fB/d. Schematic toy example.</desc><rect width="900" height="350" rx="22" fill="#f2f4ff"/><rect x="24" y="24" width="6" height="35" rx="3" fill="#ff9b3d"/><text x="44" y="49" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#17243b">One pixel of disparity can matter a lot.</text><path d="M90 220 l65 -25 v50 Z" fill="#3864e8"/><path d="M710 220 l65 -25 v50 Z" fill="#3864e8"/><rect x="360" y="125" width="160" height="116" rx="8" fill="#cdd9f1" stroke="none" stroke-width="2"/><path d="M340 125 L430 72 L535 125 Z" fill="#ff9b3d"/><path d="M155 220 L430 72" stroke="#ff9b3d" stroke-width="3" fill="none"/><path d="M155 220 L430 240" stroke="#008879" stroke-width="3" fill="none" stroke-dasharray="6 5"/><path d="M710 220 L430 72" stroke="#ff9b3d" stroke-width="3" fill="none"/><path d="M710 220 L430 240" stroke="#008879" stroke-width="3" fill="none" stroke-dasharray="6 5"/><text x="40" y="310" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17243b">d=10 → Z=10 m</text><text x="330" y="310" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17243b">d=9 → Z≈11.1 m</text><text x="620" y="310" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17243b">Z=fB/d</text></svg>