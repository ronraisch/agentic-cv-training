[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "research-engineering-onboarding"
version = "0.1.0"
description = "Inherit, diagnose, and maintain research Python with coding agents"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "httpx>=0.27,<1", "tenacity>=9,<10"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]
torch = ["torch>=2.5,<3"]
mcp = ["mcp==2.3.0"]
[project.scripts]
researchlab = "researchlab.cli:main"
researchlab-demo = "researchlab.demo_cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/researchlab"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
