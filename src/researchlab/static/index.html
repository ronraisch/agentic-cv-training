<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Remote Sensing labeling</title>
<style>body{font:16px system-ui;margin:40px;background:#f4f6f9;color:#17243a}main{max-width:900px;margin:auto}button,select{padding:9px;margin:5px}canvas{display:block;width:720px;max-width:100%;border:1px solid #aab;background:white;image-rendering:pixelated;cursor:crosshair}pre{background:white;padding:18px;white-space:pre-wrap}#status{min-height:30px}</style></head>
<body><main><h1>Remote Sensing labeling</h1><p>Select an image and drag a rectangle. Save before switching images.</p>
<label>Dataset <select id="datasets"></select></label><label>Image <select id="images"></select></label><label>Class <select id="label"></select></label>
<button id="undo">Undo last</button><button id="save">Save</button><button id="reload">Reload</button><button id="predict">Predict</button>
<p id="status" role="status"></p><canvas id="canvas"></canvas><pre id="result"></pre>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('#images');
const datasets=document.querySelector('#datasets'),labels=document.querySelector('#label');
let samples=[],image=new Image(),record,start=null;
const option=(value,text=value)=>new Option(text,value);
const status=text=>document.querySelector('#status').textContent=text;
async function api(url,options){const r=await fetch(url,options),data=await r.json();if(!r.ok)throw Error(data.error);return data;}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0);ctx.lineWidth=.5;ctx.strokeStyle='#fff';for(const a of record.annotations){const [x1,y1,x2,y2]=a.bounds;ctx.strokeRect(x1,y1,x2-x1,y2-y1);}}
async function load(){
 const id=select.value,key=encodeURIComponent(id);
 record=null;
 const selected=await api('/api/annotations?id='+key);
 const nextImage=new Image();
 nextImage.src='/api/image?id='+key;
 await nextImage.decode();
 if(id!==select.value)return;
 image=nextImage;
 labels.replaceChildren(...samples.find(sample=>sample.id===id).classes.map(name=>option(name)));
 canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
 record=selected;draw();status('Loaded '+id);
}
function changeDataset(){
 select.replaceChildren(...samples.filter(s=>s.dataset===datasets.value)
   .map(s=>option(s.id,s.id.split('/').slice(1).join('/')+' / '+s.split)));
 return load();
}
function point(event){const box=canvas.getBoundingClientRect();return [(event.clientX-box.left)*canvas.width/box.width,(event.clientY-box.top)*canvas.height/box.height];}
canvas.onpointerdown=e=>{if(!record)return;start=point(e);canvas.setPointerCapture(e.pointerId);};
canvas.onpointerup=e=>{if(!start||!record)return;const end=point(e),bounds=[Math.max(0,Math.min(start[0],end[0])),Math.max(0,Math.min(start[1],end[1])),Math.min(canvas.width,Math.max(start[0],end[0])),Math.min(canvas.height,Math.max(start[1],end[1]))];start=null;if(bounds[2]>bounds[0]&&bounds[3]>bounds[1])record.annotations.push({type:'rectangle',label:document.querySelector('#label').value,bounds});draw();status('Unsaved changes');};
document.querySelector('#undo').onclick=()=>{if(!record)return;record.annotations.pop();draw();status('Unsaved changes');};
document.querySelector('#save').onclick=()=>record&&api('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)}).then(saved=>{if(record?.image_id===saved.image_id){record=saved;status('Saved');}}).catch(e=>status(e.message));
document.querySelector('#reload').onclick=()=>load().catch(e=>status(e.message));
document.querySelector('#predict').onclick=()=>api('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sample_id:select.value})}).then(x=>document.querySelector('#result').textContent=JSON.stringify(x,null,2)).catch(e=>status(e.message));
select.onchange=()=>load().catch(e=>status(e.message));
datasets.onchange=()=>changeDataset().catch(e=>status(e.message));
api('/api/images').then(data=>{
 samples=data.items;
 datasets.replaceChildren(...[...new Set(samples.map(s=>s.dataset))].map(name=>option(name)));
 return changeDataset();
}).catch(e=>status(e.message));
</script></main></body></html>
