<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Peanuach labeling</title>
<style>body{font:16px system-ui;margin:40px;background:#f4f6f9;color:#17243a}main{max-width:900px;margin:auto}button,select{padding:9px;margin:5px}canvas{display:block;width:720px;max-width:100%;border:1px solid #aab;background:white;image-rendering:pixelated;cursor:crosshair}pre{background:white;padding:18px;white-space:pre-wrap}#status{min-height:30px}</style></head>
<body><main><h1>Peanuach labeling</h1><p>Select an image and drag a rectangle. Save before switching images.</p>
<label>Image <select id="images"></select></label><label>Class <select id="label"><option>vehicle</option><option>building</option></select></label>
<button id="undo">Undo last</button><button id="save">Save</button><button id="reload">Reload</button><button id="predict">Predict</button>
<p id="status" role="status"></p><canvas id="canvas"></canvas><pre id="result"></pre>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('#images');
let image=new Image(),record,start=null;
const status=text=>document.querySelector('#status').textContent=text;
async function api(url,options){const r=await fetch(url,options),data=await r.json();if(!r.ok)throw Error(data.error);return data;}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0);ctx.lineWidth=.5;ctx.strokeStyle='#fff';for(const a of record.annotations){const [x1,y1,x2,y2]=a.bounds;ctx.strokeRect(x1,y1,x2-x1,y2-y1);}}
async function load(){record=await api('/api/annotations?id='+encodeURIComponent(select.value));image=new Image();image.onload=()=>{canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;draw();};image.src='/api/image?id='+encodeURIComponent(select.value);status('Loaded '+select.value);}
function point(event){const box=canvas.getBoundingClientRect();return [(event.clientX-box.left)*canvas.width/box.width,(event.clientY-box.top)*canvas.height/box.height];}
canvas.onpointerdown=e=>{start=point(e);canvas.setPointerCapture(e.pointerId);};
canvas.onpointerup=e=>{if(!start)return;const end=point(e),bounds=[Math.max(0,Math.min(start[0],end[0])),Math.max(0,Math.min(start[1],end[1])),Math.min(canvas.width,Math.max(start[0],end[0])),Math.min(canvas.height,Math.max(start[1],end[1]))];start=null;if(bounds[2]>bounds[0]&&bounds[3]>bounds[1])record.annotations.push({type:'rectangle',label:document.querySelector('#label').value,bounds});draw();status('Unsaved changes');};
document.querySelector('#undo').onclick=()=>{record.annotations.pop();draw();status('Unsaved changes');};
document.querySelector('#save').onclick=()=>api('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)}).then(saved=>{record=saved;status('Saved');}).catch(e=>status(e.message));
document.querySelector('#reload').onclick=()=>load().catch(e=>status(e.message));
document.querySelector('#predict').onclick=()=>api('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sample_id:select.value})}).then(x=>document.querySelector('#result').textContent=JSON.stringify(x,null,2)).catch(e=>status(e.message));
select.onchange=()=>load().catch(e=>status(e.message));
api('/api/images').then(data=>{for(const sample of data.items){const option=document.createElement('option');option.value=sample.id;option.textContent=sample.id+' / '+sample.split;select.append(option);}return load();}).catch(e=>status(e.message));
</script></main></body></html>
