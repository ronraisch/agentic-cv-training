name: course-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_course_links.py
      - run: python3 tools/check_reading.py
      - run: python3 tools/render_reading_markdown.py --check
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra mcp --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python tools/preflight.py --scope starter
      - run: uv run --no-sync researchlab-demo smoke --root artifacts/baseline-check
      - run: uv run python -m build
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra components
      - run: uv run --no-sync researchlab-components fetch --root .local/models
      - run: curl --fail --location https://raw.githubusercontent.com/ankandrew/fast-alpr/c5a94706f175590b2bc09aa86f46182d4c267fae/assets/test_image.png --output .local/sample.png
      - run: uv run --no-sync pytest tests/test_components.py
        env:
          RESEARCHLAB_COMPONENT_MODELS: ${{ github.workspace }}/.local/models
          RESEARCHLAB_COMPONENT_IMAGE: ${{ github.workspace }}/.local/sample.png
  detector:
    runs-on: ubuntu-latest
    env:
      YOLO_CONFIG_DIR: ${{ runner.temp }}/yolo-config
      RESEARCHLAB_COCO8: ${{ runner.temp }}/coco8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra detector
      - run: |
          mkdir -p "$YOLO_CONFIG_DIR"
          curl --fail --location https://github.com/ultralytics/assets/releases/download/v0.0.0/Arial.ttf --output "$YOLO_CONFIG_DIR/Arial.ttf"
          curl --fail --location https://github.com/ultralytics/assets/releases/download/v0.0.0/coco8.zip --output "$RUNNER_TEMP/coco8.zip"
          unzip -q "$RUNNER_TEMP/coco8.zip" -d "$RUNNER_TEMP"
      - run: uv run --no-sync pytest tests/test_detector.py
