name: course-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra mcp --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python tools/preflight.py --scope starter
      - run: uv run --no-sync researchlab-demo smoke --root artifacts/baseline-check
      - run: uv run python -m build
